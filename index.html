 if(b.dataset.nirmalyFinalTheme!=="1"){
  b.dataset.nirmalyFinalTheme="1";
  b.addEventListener("click",function(e){e.preventDefault();e.stopImmediatePropagation();localStorage.setItem(KEY,isDark()?"light":"dark");forceTheme();b.setAttribute("aria-label",isDark()?"Switch to light mode":"Switch to dark mode");b.setAttribute("title",isDark()?"Switch to light mode":"Switch to dark mode")},true);
 }
 themeIcon();
}
function addButtons(){
 document.querySelectorAll("button,a,[role='button']").forEach(btn=>{
  let text=(btn.textContent||"").replace(/\s+/g," ").trim().toLowerCase(),cl=(btn.className||"").toString().toLowerCase();
  if(!/add\s*to\s*cart/.test(text)&&!cl.includes("add-to-cart")&&!cl.includes("addtocart"))return;
  btn.classList.add("nirmaly-add-cart-final");
  if(!/add\s*to\s*cart/.test(text))btn.innerHTML="Add to Cart";
  let card=btn.closest(".product-card,.product,.card,article,[data-product],.shop-card,.product-item")||btn.parentElement;
  if(!card)return;
  let details=[...card.querySelectorAll("a,button,[role='button']")].find(x=>/view\s*details/i.test(x.textContent||""));
  if(details&&btn!==details&&details.nextElementSibling!==btn)details.insertAdjacentElement("afterend",btn);
 });
}
function boot(){forceTheme();wireTheme();addButtons()}
document.addEventListener("DOMContentLoaded",boot);window.addEventListener("load",boot);setTimeout(boot,500);setTimeout(boot,1500);
})();
